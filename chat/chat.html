<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoreNode - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="chat-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <i class="fa-solid fa-arrow-left close-sidebar-btn" id="closeSidebarBtn"></i>
                    <h3>Chats</h3>
                </div>
                <div class="sidebar-actions">
                    <i class="fa-regular fa-pen-to-square"></i>
                </div>
            </div>

            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search...">
            </div>

            <div class="chat-list">
                <div class="chat-item active">
                    <div class="chat-avatar" style="background:#1A1A1A;"><i class="fa-solid fa-code"></i></div>
                    <div class="chat-info">
                        <div class="chat-title-row">
                            <span class="chat-name">CoreNode Devs</span>
                            <span class="chat-time">Online</span>
                        </div>
                        <div class="chat-meta-row">
                            <span class="chat-last-msg">Welcome everyone!</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar" style="background:#2563eb; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; border-radius:50%; width:32px; height:32px; font-size:14px;">U</div>
                    <div class="user-details">
                        <span class="user-name" id="usernameDisplay">You</span>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <div class="header-left">
                    <i class="fa-solid fa-bars menu-toggle" id="openSidebarBtn"></i>
                    <div class="header-info">
                        <div class="header-title-row">
                            <h4>CoreNode Devs</h4>
                            <span style="font-size:12px; color:#22c55e;">● Online</span>
                        </div>
                    </div>
                </div>
                <div class="header-right">
                    <i class="fa-regular fa-user"></i>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="date-divider">Today</div>
                <div class="message system-message">
                    <p>Welcome to CoreNode Devs! Please be respectful.</p>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" id="messageInput" placeholder="Message CoreNode Devs...">
                </div>
                <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/chat.js"></script>
</body>
</html>
